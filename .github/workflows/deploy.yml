name: Build, gate and deploy

on:
  push:
    branches: [main]
  pull_request: # the gate must judge PRs too, or Dependabot merges blind
    branches: [main]
  workflow_dispatch: # so a deploy can be re-run by hand, and so the
    # auto-merge job below has something to dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress a PR run would cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes, which is where a six-hour hung job comes
    # from. This suite runs in about two minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6

      - run: npm ci

      # THE WHOLE SUITE GATES, not just the browser half. A 2026-08-14 sweep
      # found 29 repos whose deploy job ran `test:a11y` alone, so their unit
      # and algorithmic suites never blocked a publish. Here that would mean
      # publishing a lab whose Keccak permutation, packing arithmetic or
      # manifest validator was broken, so long as the browser specs passed.
      - name: Unit and correctness suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The claims suite checks the page tells the truth; the a11y gate checks
      # it is usable. Both block the deploy. The claims project also carries
      # the mutation-ledger reporter, which fails the run if a ledger entry
      # claims a check that never executed.
      - name: Claims suite
        run: npm run test:claims

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA)
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the auto-merge path below depends on: the dispatched run would
    # build, pass the gate, and skip the deploy job, so the site would still
    # never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    needs: build # every gate job -- this is what makes it safe
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge any bump whose gate went green
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15          # a sibling PR merging first moves main under us
          done
          [ -n "$merged" ] || { echo "::warning::gate passed, merge did not land"; exit 0; }
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
